spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        namespace: dev

    sentinel:
      enabled: false
      transport:
        dashboard: localhost:8888
        port: 8719
      eager: true

      datasource:
        gw-flow:
          nacos:
            server-addr: ${spring.cloud.nacos.server-addr} # 引用上方配置，避免硬编码
            namespace: ${spring.cloud.nacos.discovery.namespace}
            data-id: ${spring.application.name}-gw-flow
            group-id: DEFAULT_GROUP
            rule-type: gw-flow # 网关流控规则类型
            data-type: json


  data:
    redis:
      host: 127.0.0.1
      port: 6379
      #      password: yourpassword
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8     # 最大活跃连接数
          max-idle: 8       # 最大空闲连接数
          min-idle: 0       # 最小空闲连接数
          max-wait: -1ms    # 获取连接的最大等待时间（-1 表示无限制）
server:
  port: 9528
logging:
  level:
    org.springframework.cloud.gateway: info
    org.springframework.web.reactive.function.client.ExchangeFunctions: info
    com.alibaba.csp.sentinel: debug
    com.alibaba.cloud.sentinel.gateway: debug
    com.alibaba.cloud.sentinel.datasource: debug

