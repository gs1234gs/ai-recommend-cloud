spring:
  application:
    name: recommend-app
  profiles:
    active: dev,middleware
  output:
    ansi:
      enabled: ALWAYS
server:
  port: 18888

logging:
  level:
    root: INFO
    io.r2dbc.spi: DEBUG           # R2DBC SPI 层日志
    org.springframework.r2dbc.core: DEBUG   # Spring R2DBC 核心模板日志
    io.r2dbc.postgresql.QUERY: DEBUG   # PostgreSQL 驱动的查询日志
    io.r2dbc.postgresql.PARAM: DEBUG
    org.springframework.data.r2dbc: DEBUG
    com.zaxxer.r2dbc: DEBUG       # 如果使用 HikariR2DBC（不常见）
    com.alibaba.nacos.client: DEBUG