spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        namespace: dev
    sentinel:
      transport:
        dashboard: localhost:8888
        port: 8719
      eager: true

      datasource:
        ds-authority:
          nacos:
            server-addr: ${spring.cloud.nacos.server-addr} # 建议引用上方配置，避免硬编码
            namespace: ${spring.cloud.nacos.discovery.namespace}
            data-id: ${spring.application.name}-authority-rules
            group-id: DEFAULT_GROUP
            rule-type: authority
            data-type: json
        ds-flow:
          nacos:
            server-addr: ${spring.cloud.nacos.server-addr}
            namespace: ${spring.cloud.nacos.discovery.namespace} # 【必须添加】同上
            data-id: ${spring.application.name}-flow-rules
            group-id: DEFAULT_GROUP
            rule-type: flow
            data-type: json
      enabled: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  webflux:
    multipart:
      max-in-memory-size: 100MB
  mail:
    host: smtp.qq.com             # QQ邮箱的SMTP服务器地址
    port: 587                     # 端口号（也可以用465并配合开启SSL）
    username: 2167162427@qq.com      # 你的QQ邮箱完整地址
    password: rnsiyliiwkfreaic       # 注意！这里填授权码，不是QQ登录密码
    default-encoding: utf-8       # 默认编码，防止中文乱码
    properties:
      mail:
        smtp:
          auth: true              # 开启身份认证
          starttls:
            enable: true          # 开启TLS加密
            required: true        # 必须使用TLS加密

